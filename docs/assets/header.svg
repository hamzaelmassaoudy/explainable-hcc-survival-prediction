<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Explainable HCC Survival Prediction</title>
  <desc id="description">A project banner for tabular machine learning, showing the workflow prepare, evaluate, and explain. It contains no patient data or experimental results.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30"/>
      <stop offset="1" stop-color="#172f45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <rect x="0" y="0" width="8" height="320" rx="4" fill="#5eead4"/>
